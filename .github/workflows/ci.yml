name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  # Read-only run against the real sites, so scraper changes can be checked from the
  # job log (Claude cloud sessions can't reach the cinema sites). Not a gate: sites go down.
  live:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Dry run (fetch and report; no writes, no alerts)
        run: python -m whatson run --dry-run
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Probe (what each site exposes)
        if: ${{ !cancelled() }}
        run: python scripts/probe.py
