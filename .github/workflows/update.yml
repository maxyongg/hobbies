name: update

# Every 6 hours: check sources, alert on new films, commit data, publish the web app.
on:
  schedule:
    - cron: "17 0,6,12,18 * * *" # 08:17, 14:17, 20:17, 02:17 SGT
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/**, widget/**]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Chromium (Shaw renders its list with JavaScript)
        run: python -m playwright install --with-deps chromium
      - name: Check sources
        run: python -m whatson run
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "data: update listings"
            git pull --rebase
            git push
          fi
      - name: Build site
        if: ${{ !cancelled() }}
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp widget/whats-on-sg.js _site/
          cp data/*.json _site/data/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: _site
      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
